    function changeSortOrder(val) { state.sortOrder=val; renderTopics(); }
    // ── Revision Urgency ────────────────────────────────────────
    // Returns overdue days for a Revision topic (0 = just became revision,
    // positive = days overdue since it was marked Revision).
    // Returns -1 if topic is not in Revision status.
    function getRevisionOverdueDays(t) {
        if (t.status !== 'Revision') return -1;
        // Find when revision was last triggered (auto or manual)
        var revEntries = (t.revisionHistory || []).filter(function(e){
            return e.type === 'auto-revision' || e.type === 'revision';
        });
        var refDate = null;
        if (revEntries.length > 0) {
            // Use latest revision entry date
            var latest = revEntries[revEntries.length - 1];
            refDate = latest.date || latest.time;
        } else if (t.completeDate) {
            refDate = t.completeDate;
        } else if (t.updatedAt) {
            refDate = t.updatedAt;
        }
        if (!refDate) return 0;
        var days = daysBetween(refDate, new Date());
        return Math.max(0, days);
    }

    // Returns urgency level 0-5 based on overdue days
    function getRevisionUrgencyLevel(overdueDays) {
        if (overdueDays < 0)  return -1; // not revision
        if (overdueDays === 0) return 0;  // just due today
        if (overdueDays === 1) return 1;  // 1 day late
        if (overdueDays === 2) return 2;  // 2 days late
        if (overdueDays === 3) return 3;  // 3 days late
        if (overdueDays <= 5)  return 4;  // 4-5 days late
        return 5;                          // 6+ days — critical
    }

    function getRevisionBadgeInfo(overdueDays) {
        if (overdueDays < 0) return null;
        var classes = ['fresh','mild','warm','hot','urgent','critical'];
        var labels  = ['Due Today','1d Late','2d Late','3d Late',overdueDays+'d Late',overdueDays+'d Late'];
        var level = getRevisionUrgencyLevel(overdueDays);
        return { cls: classes[level], label: (overdueDays === 0 ? 'Due Today' : overdueDays+'d Overdue') };
    }

    function sortTopics(topics,order) {
        // Always sort Revision topics by urgency (most overdue first), then apply user order within non-revision
        return topics.slice().sort(function(a,b){
            var aOD = getRevisionOverdueDays(a);
            var bOD = getRevisionOverdueDays(b);
            // Revision topics always come first, sorted darkest (most overdue) at top
            var aIsRev = a.status === 'Revision';
            var bIsRev = b.status === 'Revision';
            if (aIsRev && bIsRev) return bOD - aOD; // more overdue = higher
            if (aIsRev && !bIsRev) return -1;
            if (!aIsRev && bIsRev) return 1;
            // Non-revision: apply normal sort
            if (order==='name')      return a.name.localeCompare(b.name);
            if (order==='status')    return a.status.localeCompare(b.status);
            if (order==='updatedAt') return (b.updatedAt||'').localeCompare(a.updatedAt||'');
            return (a.createdAt||'').localeCompare(b.createdAt||'');
        });
    }

        clearTimeout(_suggestTimer);
        var box=document.getElementById('search-suggestions');
        if (!q||q.length<1) { box.innerHTML=''; box.classList.remove('visible'); return; }
        var query=q.toLowerCase(); var html='';
        var matchCourses=(state.db.courses||[]).filter(function(c){return c.name.toLowerCase().includes(query);}).slice(0,3);
        if (matchCourses.length) {
            html+='<div class="suggestion-sep">Courses</div>';
            matchCourses.forEach(function(c){
                html+='<div class="suggestion-item" onmousedown="openCourse(\''+c.id+'\');toggleSearch()">'+
                    '<span class="s-icon">📖</span><div><div class="s-name">'+hlText(c.name,q)+'</div></div></div>';
            });
        }
        var matchSubjects=(state.db.subjects||[]).filter(function(s){return s.name.toLowerCase().includes(query);}).slice(0,3);
        if (matchSubjects.length) {
            html+='<div class="suggestion-sep">Subjects</div>';
            matchSubjects.forEach(function(s){
                var course=(state.db.courses||[]).find(function(c){return c.id===s.courseId;});
                html+='<div class="suggestion-item" onmousedown="openCourseAndSubject(\''+s.courseId+'\',\''+s.id+'\')">'+
                    '<span class="s-icon">📂</span><div><div class="s-name">'+hlText(s.name,q)+'</div>'+
                    '<div class="s-path">'+(course?esc(course.name):'')+'</div></div></div>';
            });
        }
        var matchTopics=(state.db.topics||[]).filter(function(t){
            return t.name.toLowerCase().includes(query)||(t.description||'').toLowerCase().includes(query);
        }).slice(0,4);
        if (matchTopics.length) {
            html+='<div class="suggestion-sep">Topics</div>';
            matchTopics.forEach(function(t){
                var subj=(state.db.subjects||[]).find(function(s){return s.id===t.subjectId;});
                var course=subj?(state.db.courses||[]).find(function(c){return c.id===subj.courseId;}):null;
                html+='<div class="suggestion-item" onmousedown="navigateToTopic(\''+t.id+'\')">'+
                    '<span class="s-icon">📋</span><div><div class="s-name">'+hlText(t.name,q)+'</div>'+
                    '<div class="s-path">'+(course?esc(course.name)+' › ':'')+' '+(subj?esc(subj.name):'')+'</div></div></div>';
            });
        }
        if (!html) { box.innerHTML=''; box.classList.remove('visible'); return; }
        box.innerHTML=html; box.classList.add('visible');
    }

    function openCourseAndSubject(courseId,subjectId) {
        state.activeCourse=(state.db.courses||[]).find(function(c){return c.id===courseId;});
        state.activeSubject=(state.db.subjects||[]).find(function(s){return s.id===subjectId;});
        state.expandedTopic=null; state.view='topics'; renderView(); updateNav(); hideSuggestions();
    }
    function navigateToTopic(topicId) {
        var topic=(state.db.topics||[]).find(function(t){return t.id===topicId;});
        if (!topic) return;
        var subject=(state.db.subjects||[]).find(function(s){return s.id===topic.subjectId;});
        var course=subject?(state.db.courses||[]).find(function(c){return c.id===subject.courseId;}):null;
        if (subject&&course) openCourseAndSubject(course.id,subject.id);
        hideSuggestions();
        setTimeout(function(){
            document.querySelectorAll('.topic-card.expanded').forEach(function(c){c.classList.remove('expanded');});
            var card=document.getElementById('tc-'+topicId);
            if (card) { card.classList.add('expanded'); state.expandedTopic=topicId; card.scrollIntoView({behavior:'smooth',block:'center'}); }
        },350);
    }
    function applySearch(arr,fields) {
        if (!state.searchQuery) return arr;
        var q=state.searchQuery.toLowerCase();
        return arr.filter(function(item){return fields.some(function(f){return (item[f]||'').toLowerCase().includes(q);});});
    }

    var _topicNameSuggestTimer;
    function getAllTopicNamesWithPath() {
        var seen = {}; var list = [];
        (state.db.topics||[]).forEach(function(t) {
            var key = (t.name || '').toLowerCase();
            if (!key || seen[key]) return;
            seen[key] = true;
            var subj = state.db.subjects.find(function(s){return s.id===t.subjectId;});
            var course = subj ? state.db.courses.find(function(c){return c.id===subj.courseId;}) : null;
            list.push({ name: t.name, path: (course?course.name+' › ':'')+(subj?subj.name:'') });
        });
        return list;
    }
    function filterTopicNameSuggestions(q) {
        var box = document.getElementById('topic-name-suggest');
        if (!box) return;
        q = (q||'').trim().toLowerCase();
        if (!q) { box.innerHTML=''; box.classList.remove('visible'); return; }
        var matches = getAllTopicNamesWithPath().filter(function(item){
            return item.name.toLowerCase().includes(q);
        }).slice(0,6);
        if (!matches.length) { box.innerHTML=''; box.classList.remove('visible'); return; }
        box.innerHTML = matches.map(function(item){
            return '<div class="tns-item" onmousedown="selectTopicNameSuggestion(\''+escAttr(item.name)+'\')">'+
                esc(item.name)+(item.path?'<div class="tns-path">'+esc(item.path)+'</div>':'')+'</div>';
        }).join('');
        box.classList.add('visible');
    }
    function selectTopicNameSuggestion(name) {
        var el = document.getElementById('m-name');
        if (el) el.value = name;
        hideTopicNameSuggestions();
    }
    function hideTopicNameSuggestions() {
        var box = document.getElementById('topic-name-suggest');
        if (box) box.classList.remove('visible');
    }
    function hideTopicNameSuggestionsDelayed() {
        clearTimeout(_topicNameSuggestTimer);
        _topicNameSuggestTimer = setTimeout(hideTopicNameSuggestions, 200);
    }

    function showTrashView() { window._trashFilter='all'; state.view='trash'; renderView(); updateNav(); }
    function renderTrash() {
        updateNav();
        var el=document.getElementById('main-content');
        var active=window._trashFilter||'all';
        var tabs=['all','course','subject','topic','media-image','media-link','media-pdf'].map(function(f){
            var labels={'all':'🗄 All','course':'📖 Courses','subject':'📂 Subjects','topic':'📋 Topics','media-image':'📸 Images','media-link':'▶️ Links','media-pdf':'📄 PDFs'};
            return '<button class="view-tab '+(active===f?'active':'')+'" onclick="filterTrash(\''+f+'\')">'+labels[f]+'</button>';
        }).join('');
        var items=state.db.trash||[];
        if(active!=='all')items=items.filter(function(i){return i.type===active;});
        var list=!items.length
            ?emptyState('🗑','Trash is Empty','Deleted items will appear here')
            :items.map(function(item){
                var origIdx=state.db.trash.indexOf(item);
                var icons={'course':'📖','subject':'📂','topic':'📋','media-image':'📸','media-link':'▶️','media-pdf':'📄'};
                var displayName = item.data.name || item.data.url || item.data.path || '—';
                return '<div class="trash-item">'+
                    '<div class="trash-icon">'+(icons[item.type]||'📄')+'</div>'+
                    '<div class="trash-info">'+
                    '<div class="trash-name">'+esc(displayName)+'</div>'+
                    (item.path?'<div class="trash-path">📍 '+esc(item.path)+'</div>':'')+
                    '<div class="trash-date">🗑 '+item.deletedAt+'</div>'+
                    '</div><button class="recover-btn" onclick="recoverItem('+origIdx+')">↩ Recover</button></div>';
            }).join('');
        el.innerHTML='<div class="section-title">Trash <small>'+(state.db.trash||[]).length+' items</small></div>'+
            '<div class="view-tabs" style="flex-wrap:wrap;height:auto;gap:4px;padding:6px;">'+tabs+'</div>'+
            '<div style="display:flex;flex-direction:column;gap:8px;margin-top:10px">'+list+'</div>';
    }
    function filterTrash(f){window._trashFilter=f;renderTrash();}
    function recoverItem(idx){
        apiCall('recoverFromTrash',[idx],function(r){if(r.ok){reloadDB();showToast(r.type+' recover ho gaya ✓','success');}else showToast(r.msg,'error');});
    }

    // ══════════════════════════════════════════════
    // BACKUP
    // ══════════════════════════════════════════════
    function showBackupView(){state.view='backup';renderView();updateNav();}
    function renderBackup(){
        updateNav();
        document.getElementById('main-content').innerHTML=
            '<div class="section-title">Backup & Restore</div>'+
            '<div class="backup-panel"><h4>📤 Export Backup</h4><p>Poora study database JSON file mein download karo.</p>'+
            '<div class="backup-row"><button class="btn btn-primary" onclick="doExport()">Export JSON</button></div></div>'+
            '<div class="backup-panel"><h4>📥 Import Backup</h4><p>⚠️ Yeh saara data <strong>replace</strong> kar dega. Pehle export karo!</p>'+
            '<div class="modal-field"><label class="modal-label">Option 1 — Purani backup file choose karo (.json):</label>'+
            '<div class="backup-row"><button class="btn btn-ghost" onclick="triggerImportFile()">📁 Choose Backup File</button></div>'+
            '<input type="file" class="hidden-file" id="import-file-input" accept="application/json,.json" onchange="handleImportFile(event)"/>'+
            '</div>'+
            '<div class="modal-field"><label class="modal-label">Option 2 — Ya JSON yahan paste karo:</label>'+
            '<textarea class="modal-textarea" id="import-json" rows="8" placeholder=\'{"courses":[],...}\'></textarea></div>'+
            '<div class="backup-row"><button class="btn btn-primary" onclick="doImport()">Import & Replace</button></div></div>';
    }
    function doExport(){
        apiCall('exportBackup',[],function(data){
            var json=JSON.stringify(data,null,2);
            var blob=new Blob([json],{type:'application/json'});
            var url=URL.createObjectURL(blob);
            var a=document.createElement('a');
            a.href=url;a.download='StudyTopicBackup_'+new Date().toISOString().slice(0,10)+'.json';
            a.click();URL.revokeObjectURL(url);showToast('Backup export ho gaya ✓','success');
        });
    }
    function triggerImportFile(){ var el=document.getElementById('import-file-input'); if(el) el.click(); }
    function handleImportFile(event){
        var file=event.target.files[0];
        if(!file)return;
        var reader=new FileReader();
        reader.onload=function(e){
            var ta=document.getElementById('import-json');
            if(ta) ta.value = e.target.result;
            showToast('Backup file load ho gayi — ab "Import & Replace" dabao','success');
        };
        reader.readAsText(file);
        event.target.value='';
    }
    function doImport(){
        var json=(document.getElementById('import-json')||{}).value;
        if(!json||!json.trim())return showToast('JSON paste karo ya file choose karo pehle','error');
        openModal('Confirm Import',
            '<p style="color:var(--text2);font-size:.9rem">Yeh <strong style="color:var(--danger)">saara data replace</strong> kar dega. Continue?</p>',
            '<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>'+
            '<button class="btn btn-primary" style="background:var(--danger)" onclick="submitImport()">Haan, Import Karo</button>');
        window._pendingImport=json;
    }
    function submitImport(){
        closeModal();
        apiCall('importBackup',[window._pendingImport],function(r){if(r.ok){reloadDB();showToast('Backup import ho gaya ✓','success');}else showToast(r.msg,'error');});
    }

    // ══════════════════════════════════════════════
    // NOTEPAD — Redesigned with Rich Editor
    // ══════════════════════════════════════════════
    function loadNotepadLocal(){
        try{
            var stored=localStorage.getItem('studyNotepadV2');
            if(stored){var data=JSON.parse(stored);notepadState.books=data.books||{'Default':''};notepadState.activeBook=data.activeBook||Object.keys(notepadState.books)[0];}
        }catch(e){var old=localStorage.getItem('studyNotepad');if(old)notepadState.books={'Default':old};}
        renderNotepadBooks();loadCurrentBook();
    }

    function npExec(cmd, val) {
        document.getElementById('notepad-editor').focus();
        document.execCommand(cmd, false, val || null);
        onNotepadRichInput();
    }
    function npFontSize(size) { npExec('fontSize', size); }
    function npHighlight(color) { npExec('hiliteColor', color); }
    function npHeading(tag) {
        document.getElementById('notepad-editor').focus();
        document.execCommand('formatBlock', false, tag);
        onNotepadRichInput();
    }
    function npInsertDivider() {
        document.getElementById('notepad-editor').focus();
        document.execCommand('insertHTML', false, '<hr style="border:none;border-top:2px solid rgba(91,138,240,.4);margin:10px 0;"/>');
        onNotepadRichInput();
    }
    function onNotepadKeyDown(e) {
        if (e.key === 'Tab') {
            e.preventDefault();
            document.execCommand('insertHTML', false, '&nbsp;&nbsp;&nbsp;&nbsp;');
        }
    }
    function onNotepadRichInput() {
        var editor = document.getElementById('notepad-editor');
        if (!editor) return;
        var html = editor.innerHTML;
        notepadState.books[notepadState.activeBook] = html;
        var text = editor.innerText || '';
        updateWordCount(text);
        updateLineNumbers(text);
        notepadState.isDirty = true;
        document.getElementById('save-label').textContent = 'Saving…';
        clearTimeout(notepadState.saveTimer);
        notepadState.saveTimer = setTimeout(function(){
            saveCurrentBookContent(); saveNotepadToServer();
        }, 800);
    }

    function openNotepad() {
        document.getElementById('notepad-overlay').classList.add('open');
        apiCall('loadNotepad', [], function(data) {
            if (data && data.books) {
                notepadState.books = data.books;
                if (data.activeBook && data.books[data.activeBook] !== undefined) notepadState.activeBook = data.activeBook;
                else notepadState.activeBook = Object.keys(data.books)[0];
            }
            renderNotepadBooks();
            loadCurrentBook();
        });
        var saved = localStorage.getItem('studyNotepadV2');
        if (saved) {
            try {
                var obj = JSON.parse(saved);
                if (obj.books) {
                    notepadState.books = obj.books;
                    if (obj.activeBook && obj.books[obj.activeBook] !== undefined) notepadState.activeBook = obj.activeBook;
                    renderNotepadBooks(); loadCurrentBook();
                }
            } catch(e) {}
        }
        applyNotepadFont(notepadState.fontMode);
        document.getElementById('save-label').textContent = 'Saved ✓';
    }

    function renderNotepadBooks() {
        var bar = document.getElementById('notepad-books-bar');
        if (!bar) return;
        var html = '';
        Object.keys(notepadState.books).forEach(function(name) {
            var active = name === notepadState.activeBook;
            html += '<button class="book-tab'+(active?' active':'')+'" onclick="switchBook(\''+escAttr(name)+'\')">'+esc(name)+'</button>';
        });
        html += '<button class="book-tab-add" onclick="promptAddBook()" title="Add notebook">＋</button>';
        bar.innerHTML = html;
        var titleEl = document.getElementById('notepad-book-title');
        if (titleEl) titleEl.textContent = '✏ ' + notepadState.activeBook;
    }

    function loadCurrentBook(){
        var editor = document.getElementById('notepad-editor');
        var content = notepadState.books[notepadState.activeBook] || '';
        if (editor) {
            editor.innerHTML = content;
            var text = editor.innerText || '';
            updateWordCount(text);
            updateLineNumbers(text);
        }
    }

    function switchBook(name){saveCurrentBookContent();notepadState.activeBook=name;renderNotepadBooks();loadCurrentBook();}

    function updateLineNumbers(text) {
        var numEl = document.getElementById('notepad-line-nums');
        if (!numEl) return;
        var lines = (text || '').split('\n');
        var count = Math.max(lines.length, 1);
        var html = '';
        for (var i = 1; i <= count; i++) {
            html += '<div class="line-num">' + i + '</div>';
        }
        numEl.innerHTML = html;
    }

    function saveCurrentBookContent(){
        var editor = document.getElementById('notepad-editor');
        var val = editor ? editor.innerHTML : '';
        notepadState.books[notepadState.activeBook]=val;
        localStorage.setItem('studyNotepadV2',JSON.stringify({books:notepadState.books,activeBook:notepadState.activeBook}));
    }

    function saveNotepadToServer(){
        var bookName=notepadState.activeBook;
        var content=notepadState.books[bookName]||'';
        fetch('api.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'saveNotepadContent', params: [bookName, content] })
        })
            .then(function(res){ if(!res.ok) throw new Error('HTTP '+res.status); return res.json(); })
            .then(function(){ document.getElementById('save-label').textContent='Saved ✓'; notepadState.isDirty=false; })
            .catch(function(){ document.getElementById('save-label').textContent='Save failed ⚠'; });
    }

    function promptAddBook(){
        openModal('Naya Notebook',
            '<div class="modal-field"><label class="modal-label">Notebook ka naam</label><input class="modal-input" id="m-book-name" placeholder="e.g. Math Notes"/></div>',
            '<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="submitAddBook()">Add</button>');
        setTimeout(function(){var el=document.getElementById('m-book-name');if(el)el.focus();},100);
    }
    function submitAddBook(){
        var name=(document.getElementById('m-book-name')||{}).value;
        if(!name||!name.trim())return showToast('Naam daalo','error');
        closeModal();
        if(notepadState.books[name.trim()])return showToast('Yeh naam pehle se hai','error');
        notepadState.books[name.trim()]='';notepadState.activeBook=name.trim();
        renderNotepadBooks();loadCurrentBook();
        apiCall('addNotepadBook',[name.trim()],function(r){if(r&&r.ok&&r.data)notepadState.books=r.data.books;});
        showToast('Notebook add ho gayi ✓','success');
    }
    function promptRenameBook(){
        var current=notepadState.activeBook;
        openModal('Rename Notebook',
            '<div class="modal-field"><label class="modal-label">Naya naam</label><input class="modal-input" id="m-book-name" value="'+esc(current)+'"/></div>',
            '<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="submitRenameBook(\''+escAttr(current)+'\')">Rename</button>');
        setTimeout(function(){var el=document.getElementById('m-book-name');if(el){el.focus();el.select();}},100);
    }
    function submitRenameBook(oldName){
        var newName=(document.getElementById('m-book-name')||{}).value;
        if(!newName||!newName.trim())return showToast('Naam daalo','error');
        closeModal();
        if(notepadState.books[newName.trim()]!==undefined&&newName.trim()!==oldName)return showToast('Yeh naam pehle se hai','error');
        notepadState.books[newName.trim()]=notepadState.books[oldName];
        if(oldName!==newName.trim())delete notepadState.books[oldName];
        notepadState.activeBook=newName.trim();renderNotepadBooks();
        apiCall('renameNotepadBook',[oldName,newName.trim()],function(){});
        showToast('Rename ho gaya ✓','success');
    }
    function promptDeleteBook(){
        var books=Object.keys(notepadState.books);
        if(books.length<=1)return showToast('Aakhri notebook delete nahi kar sakte','error');
        openModal('Delete Notebook?',
            '<p style="color:var(--text2);font-size:.9rem"><strong>"'+esc(notepadState.activeBook)+'"</strong> notebook aur uske saare notes delete honge.</p>',
            '<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>'+
            '<button class="btn btn-primary" style="background:var(--danger)" onclick="submitDeleteBook()">Delete</button>');
    }
    function submitDeleteBook(){
        closeModal();
        var name=notepadState.activeBook;
        var books=Object.keys(notepadState.books);
        if(books.length<=1)return showToast('Aakhri notebook delete nahi kar sakte','error');
        delete notepadState.books[name];notepadState.activeBook=Object.keys(notepadState.books)[0];
        renderNotepadBooks();loadCurrentBook();
        apiCall('deleteNotepadBook',[name],function(r){if(r&&r.ok&&r.data)notepadState.books=r.data.books;});
        showToast('Notebook delete ho gayi','success');
    }
    function closeNotepad(){
        saveCurrentBookContent();clearTimeout(notepadState.saveTimer);
        if(notepadState.isDirty)saveNotepadToServer();
        document.getElementById('notepad-overlay').classList.remove('open');
    }
    function notepadOverlayClick(e){if(e.target===document.getElementById('notepad-overlay'))closeNotepad();}
    function setNotepadFont(mode){notepadState.fontMode=mode;localStorage.setItem('notepadFont',mode);applyNotepadFont(mode);}
    function applyNotepadFont(mode){
        var body=document.getElementById('notepad-body');
        var editor=document.getElementById('notepad-editor');
        document.getElementById('font-btn-hindi').classList.toggle('active',mode==='hindi');
        document.getElementById('font-btn-urdu').classList.toggle('active',mode==='urdu');
        document.getElementById('font-btn-serif').classList.toggle('active',mode==='serif');
        if(mode==='urdu'){
            body.classList.add('urdu-mode');
            if(editor){editor.dir='rtl';editor.style.fontFamily="'Noto Nastaliq Urdu', serif";editor.style.fontSize='1.3rem';editor.style.lineHeight='38px';editor.style.textAlign='right';editor.setAttribute('data-placeholder','آپ یہاں لکھ سکتے ہیں…');}
        } else if(mode==='serif'){
            body.classList.remove('urdu-mode');
            if(editor){editor.dir='ltr';editor.style.fontFamily="Georgia, 'Times New Roman', serif";editor.style.fontSize='1rem';editor.style.lineHeight='28px';editor.style.textAlign='left';editor.setAttribute('data-placeholder','Apne thoughts yahan likho… 📝');}
        } else {
            body.classList.remove('urdu-mode');
            if(editor){editor.dir='ltr';editor.style.fontFamily="'Caveat', cursive";editor.style.fontSize='1.22rem';editor.style.lineHeight='32px';editor.style.textAlign='left';editor.setAttribute('data-placeholder','Apne thoughts yahan likho… 📝');}
        }
    }
    function updateWordCount(text){
        var words=text.trim()?text.trim().split(/\s+/).length:0;
        document.getElementById('notepad-wordcount').textContent=words+' words';
    }

    // ══════════════════════════════════════════════
    // API HELPER + RELOAD
    // ══════════════════════════════════════════════
    function apiCall(fnName,args,successHandler){
        fetch('api.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: fnName, params: args })
        })
            .then(function(res) {
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return res.json();
            })
            .then(function(data) {
                if (typeof successHandler === 'function') successHandler(data);
            })
            .catch(function(err) {
                showToast('⚠ ' + err.message, 'error');
            });
    }
    function reloadDB(){
        apiCall('loadAll', [], function(data){ state.db=data; renderView(); updateStats(); });
    }

    // ══════════════════════════════════════════════
    // HELPERS
    // ══════════════════════════════════════════════
    function esc(str){
        return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function escAttr(str){return String(str||'').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
    function daysBetween(dateStr,toDate){return Math.floor((toDate-new Date(dateStr))/(1000*60*60*24));}
    function emptyState(icon,title,text){
        return '<div class="empty-state"><div class="empty-icon">'+icon+'</div><h3>'+title+'</h3><p>'+text+'</p></div>';
    }
    var _toastTimer;
    function showToast(msg,type){
        var el=document.getElementById('toast');
        el.textContent=msg;el.className='show '+(type||'');
        clearTimeout(_toastTimer);
        _toastTimer=setTimeout(function(){el.className='';},2800);
    }

    // ══════════════════════════════════════════════
    // SETUP CONFIG LOADER (setup.php se settings)
    // ══════════════════════════════════════════════
    function applySetupConfig() {
        // Logo
        var logo = localStorage.getItem('stm_logo');
        if (!logo) {
            // Server se load karo
            fetch('data/logo.txt')
                .then(function(r){ if(r.ok) return r.text(); })
                .then(function(t){
                    if (t && t.trim()) {
                        try { localStorage.setItem('stm_logo', t.trim()); } catch(e) {}
                        setHeaderLogo(t.trim());
                    }
                })
                .catch(function(){});
        } else {
            setHeaderLogo(logo);
        }

        // Accent color
        var color = localStorage.getItem('stm_accentColor');
        if (!color) {
            fetch('data/config.json')
                .then(function(r){ if(r.ok) return r.json(); })
                .then(function(cfg){
                    if (cfg && cfg.accentColor) {
                        try { localStorage.setItem('stm_accentColor', cfg.accentColor); } catch(e) {}
                        setAccentColor(cfg.accentColor);
                    }
                    if (cfg && cfg.appTitle) {
                        document.title = cfg.appTitle;
                    }
                })
                .catch(function(){});
        } else {
            setAccentColor(color);
        }
    }
    function setHeaderLogo(src) {
        var img = document.getElementById('header-logo');
        if (!img || !src) return;
        img.src = src;
        img.style.display = 'block';
    }
    function setAccentColor(hex) {
        if (!hex) return;
        document.documentElement.style.setProperty('--accent', hex);
        // Lighten for accent2
        document.documentElement.style.setProperty('--accent2', hex);
    }
    applySetupConfig();

    boot();
</script>
